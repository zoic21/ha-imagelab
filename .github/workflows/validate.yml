name: Validate integration

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the version declared in manifest.json
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          comment: 'false'

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@master

  publish:
    name: Publish release
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    needs: [hacs, hassfest]
    runs-on: ubuntu-latest
    concurrency:
      group: publish-image-lab-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Publish the integration version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -er '.version | strings' custom_components/image_lab/manifest.json)
          release_flags=()
          if [[ "$GITHUB_REF" == refs/heads/dev ]]; then
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-dev\.[1-9][0-9]*$ ]]; then
              echo "No development version to publish: $version"
              exit 0
            fi
            release_flags=(--prerelease --latest=false)
          elif [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid stable version: $version"
            exit 1
          fi

          existing_tag=$(git ls-remote --tags origin "refs/tags/$version")
          if [[ -n "$existing_tag" ]]; then
            echo "Tag $version already exists; keeping the published version unchanged."
            exit 0
          fi
          gh release create "$version" --target "$GITHUB_SHA" --title "Image Lab $version" \
            --generate-notes "${release_flags[@]}"
