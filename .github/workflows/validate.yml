name: Validate integration

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the version declared in manifest.json
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          comment: 'false'

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@master

  tests:
    name: Tests Home Assistant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install homeassistant==2026.10.4 tarsius==0.5.3 pytest
      - run: python -m pytest -q

  frontend:
    name: TypeScript and packaged panel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npx --yes --package typescript@6.0.3 tsc -p frontend --outDir "$RUNNER_TEMP/panel"
      - run: diff -ru custom_components/image_lab/panel "$RUNNER_TEMP/panel"

  publish:
    name: Publish release
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main') ||
      github.event_name == 'push'
    needs: [hacs, hassfest, tests, frontend]
    runs-on: ubuntu-latest
    concurrency:
      group: publish-image-lab-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Publish the integration version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -er '.version | strings' custom_components/image_lab/manifest.json)
          if [[ "$GITHUB_REF" == refs/heads/dev ]]; then
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-dev\.[1-9][0-9]*$ ]]; then
              echo "No development version to publish: $version"
              exit 0
            fi
            release_flags=(--prerelease --latest=false --generate-notes)
          elif [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid stable version: $version"
            exit 1
          fi

          existing_tag=$(git ls-remote --tags origin "refs/tags/$version")
          if [[ -n "$existing_tag" ]]; then
            echo "Tag $version already exists; keeping the published version unchanged."
            exit 0
          fi
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            notes_file="$RUNNER_TEMP/image-lab-release.md"
            awk -v version="$version" '
              /^## / { if (found) exit; found = ($2 == version); next }
              found { print }
            ' CHANGELOG.md > "$notes_file"
            if ! grep -q '[^[:space:]]' "$notes_file"; then
              echo "Missing changelog for stable version $version" >&2
              exit 1
            fi
            release_flags=(--latest --notes-file "$notes_file")
          fi
          gh release create "$version" --target "$GITHUB_SHA" --title "Image Lab $version" \
            "${release_flags[@]}"
