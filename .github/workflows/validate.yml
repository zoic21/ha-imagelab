name: Validate integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the version declared in manifest.json
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          comment: 'false'

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@master

  publish:
    name: Publish release
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: [hacs, hassfest]
    runs-on: ubuntu-latest
    concurrency: publish-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Publish the integration version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -er '.version | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' custom_components/image_lab/manifest.json)
          existing_tag=$(git ls-remote --tags origin "refs/tags/$version")
          if [[ -n "$existing_tag" ]]; then
            echo "Tag $version already exists." >&2
            exit 1
          fi
          gh release create "$version" --target "$GITHUB_SHA" --title "Image Lab $version" --generate-notes
